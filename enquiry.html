<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaTech Solutions | Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <nav>
           
           
        
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Services</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Make an Enquiry</h2>

            <p>
                Complete the form below and a member of NovaTech Solutions
                will respond to your enquiry.
            </p>

            <form action="#" method="post">

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <br><br>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <br><br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone">

                <br><br>

                <label for="service">Service Required:</label>
                <select id="service" name="service" required>
                    <option value="">-- Select a Service --</option>
                    <option value="website-development">Website Development</option>
                    <option value="it-support">IT Support</option>
                    <option value="computer-repairs">Computer Repairs</option>
                    <option value="software-support">Software Installation and Support</option>
                    <option value="network-support">Basic Network Support</option>
                </select>

                <br><br>

                <label for="message">Your Enquiry:</label>
                <br>
                <textarea id="message" name="message" rows="6" cols="40"
                    placeholder="Tell us how we can help you..." required></textarea>

                <br><br>

                <button type="submit">Submit Enquiry</button>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 NovaTech Solutions. All rights reserved.</p>
    </footer>
    
</body>
</html>
